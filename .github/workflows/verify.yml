name: verify

# X-003 / CORE-007 — cross-platform is a claim until CI proves it. Windows is listed
# first because it is the primary target and the platform where this project's two worst
# bugs lived (an unescaped path in JSON, and a shell child that survived its timeout).
#
# Node range: the test suite runs sources via --experimental-strip-types, which exists
# from Node 22.6 on — Node 20 cannot even parse the flag. The shipped artifact (dist/)
# is plain ES2022 JS, but a claim is not support until CI exercises it, so the matrix
# covers exactly the versions this file declares: 22 and 24.
#
# Step order matters: tests inspect the compiled dist/ (packaging regressions) and the
# L2 shim is only written when dist/plugin exists — so `build` MUST run before `test`.
# The first public CI run proved it: test-before-build failed 9/9 jobs on a fresh clone
# where dist/ did not exist yet.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: runtime

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run clean && npm run build

      - name: test
        run: npm test

      - name: pack and install from the tarball
        shell: bash
        run: |
          # The failure this catches: Node refuses to strip TypeScript types under
          # node_modules, so a package shipping raw .ts installs cleanly and then throws
          # on first run. Only a real install proves the published artifact works.
          npm pack
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          # Glob, not a hardcoded version — a version bump must not break the pipeline.
          tarball=$(ls "$GITHUB_WORKSPACE"/runtime/apex-agent-*.tgz | head -n1)
          npm install "$tarball"
          npx apex-agent --version
          npx apex-agent init
          npx apex-agent gate || true   # an empty ledger must FAIL the gate
